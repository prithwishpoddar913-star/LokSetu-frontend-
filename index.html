<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F47721" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stampSafar.theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedLang = localStorage.getItem('stampSafar.lang');
          if (savedLang) {
            document.documentElement.lang = savedLang;
          }
        } catch (e) {}
      })();
    </script>
    <title>Stamp Safar — From Stamps to Destinations, From Heritage to Livelihood</title>
    <meta name="description" content="Seva First Innovation Challenge entry: Connecting postage stamps to cultural destinations and rural artisan livelihoods across West Bengal, Bihar, and Jharkhand." />
    <link rel="icon" type="image/jpeg" href="/stamp-safar-logo.jpeg" />
    <link rel="apple-touch-icon" href="/stamp-safar-logo.jpeg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
