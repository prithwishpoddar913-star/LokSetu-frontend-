<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — LokSetu</title>
  <style>
    :root {
      --primary: #F47721;
      --bg: #FFF7F0;
      --text: #252525;
      --muted: #777777;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141A;
        --text: #F3F4F6;
        --muted: #9CA3AF;
      }
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      padding: 36px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(244, 119, 33, 0.25);
      border-radius: 24px;
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 16px;
      object-fit: cover;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      color: var(--text);
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 14px rgba(244, 119, 33, 0.35);
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/loksetu-logo.jpg" alt="LokSetu" class="logo">
    <h1>You are offline</h1>
    <p>Please check your internet connection to continue exploring LokSetu's living heritage destinations, homestays, and stamps.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
