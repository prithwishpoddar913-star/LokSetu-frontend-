<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Stamp Safar</title>
  <style>
    :root {
      --primary: #F47721;
      --bg: #FFF7F0;
      --text: #252525;
      --muted: #777777;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141A;
        --text: #F3F4F6;
        --muted: #9CA3AF;
      }
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      padding: 36px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(244, 119, 33, 0.25);
      border-radius: 24px;
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: var(--text);
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/stamp-safar-logo.jpeg" alt="Stamp Safar" class="logo">
    <h1>You're Currently Offline</h1>
    <p>It seems your device is not connected to the internet. Previously cached heritage stories and stamps remain readable, but new live bookings require an internet connection.</p>
    <button onclick="window.location.reload()">Check Connection & Retry</button>
  </div>
</body>
</html>
